<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071880">
<title>Preços — Adega Noruega</title>
<style>
:root{
  --nav:#071880;
  --nav-alto:#152CA0;
  --nav-claro:#2F45C4;
  --ink:#121417;
  --paper:#FFFFFF;
  --sheet:#F6F6F6;
  --line:#E1E3E8;
  --mute:#6B7280;
  --ouro:#D9A32C;
  --ouro-fundo:#FDF6E6;
  --toque:56px;
  --gut:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{min-height:100vh;display:flex;flex-direction:column;}
#tela{flex:1;display:flex;flex-direction:column;background:#fff;}
.quadro{flex:1;}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:16px;line-height:1.4;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font:inherit;color:inherit;}
:focus-visible{outline:3px solid var(--nav-claro);outline-offset:2px;}

/* ---------- topo fixo ---------- */
.topo{position:sticky;top:0;z-index:30;background:var(--nav);color:#fff;
  padding:calc(10px + env(safe-area-inset-top)) var(--gut) 12px;}
.marca{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.selo{width:34px;height:34px;border-radius:50%;flex:0 0 auto;
  object-fit:cover;background:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.4);}
.marca h1{margin:0;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;}
.marca .sub{margin-left:auto;font-size:12px;color:rgba(255,255,255,.62);}

/* ---- tela de entrada (login da equipe) ---- */
body.entrada-tela .topo, body.entrada-tela .estado{display:none;}
.entrada-box{max-width:320px;margin:14vh auto 0;padding:0 20px;text-align:center;}
.entrada-logo{width:64px;height:64px;border-radius:50%;object-fit:cover;
  box-shadow:0 2px 10px rgba(7,24,128,.25);margin-bottom:16px;}
.entrada-box h1{margin:0 0 6px;font-size:19px;font-weight:800;color:var(--nav);}
.entrada-box p{margin:0 0 18px;font-size:14px;color:var(--mute);line-height:1.5;}
.entrada-box .entrada-erro{color:var(--ouro);font-weight:600;margin-top:-8px;margin-bottom:14px;}
.entrada-box input{width:100%;height:52px;padding:0 15px;border:1.5px solid #C9C9C9;
  border-radius:10px;font-family:inherit;font-size:17px;text-align:center;
  color:var(--ink);outline:none;margin-bottom:12px;box-sizing:border-box;}
.entrada-box input:focus{border-color:var(--nav);}
.entrada-box button{width:100%;height:52px;border:0;border-radius:10px;background:var(--nav);
  color:#fff;font-size:16px;font-weight:700;cursor:pointer;}
.entrada-box button:disabled{background:#B5B9C6;}
.entrada-box .entrada-cancelar{background:none;color:var(--mute);margin-top:8px;font-weight:600;}

.campo{position:relative;}
.campo input{width:100%;font-family:inherit;font-size:17px;font-weight:500;
  height:var(--toque);padding:0 46px 0 44px;border:0;border-radius:12px;
  background:#fff;color:var(--ink);outline:none;}
.campo input::placeholder{color:#8B93A4;font-weight:400;}
.lupa{position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;pointer-events:none;opacity:.5;}
.limpar{position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:46px;height:46px;border:0;background:none;color:var(--mute);
  font-size:26px;line-height:1;cursor:pointer;display:none;border-radius:10px;}
.limpar.on{display:block;}

/* ---------- barra de estado ---------- */
.estado{display:flex;align-items:center;gap:10px;
  padding:9px var(--gut);background:var(--sheet);border-bottom:1px solid var(--line);
  font-size:13px;color:var(--mute);}
.estado .quando{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.estado .quando b{color:var(--ink);font-weight:600;}
.status-doses{color:var(--mute);}
.status-doses.ok{color:#0A7A3D;}
.status-doses.aviso{color:var(--ouro);}
.atualizar{flex:0 0 auto;height:36px;padding:0 14px;border:1px solid var(--line);
  background:#fff;border-radius:8px;font-size:13px;font-weight:600;color:var(--nav);cursor:pointer;}
.atualizar:disabled{color:var(--mute);cursor:default;}

/* ---------- quadro de categorias ---------- */
.quadro{padding:16px var(--gut) 34px;background:var(--nav);min-height:calc(100vh - 190px);}
.quadro .titulo{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:rgba(255,255,255,.5);margin:0 0 12px 2px;}
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;align-items:stretch;}
.tile{display:flex;align-items:center;gap:8px;min-height:52px;
  padding:9px 11px;border:1px solid rgba(255,255,255,.14);
  background:var(--nav-alto);color:#fff;border-radius:10px;text-align:left;cursor:pointer;
  transition:background .12s;overflow:hidden;}
.tile:active{background:var(--nav-claro);}
.tile .nm{flex:1;min-width:0;font-size:13.5px;font-weight:650;line-height:1.2;
  letter-spacing:.004em;overflow-wrap:break-word;}
.tile .ct{flex:0 0 auto;font-size:11.5px;color:rgba(255,255,255,.5);
  font-variant-numeric:tabular-nums;}
.tile.combo{background:#0E5C4A;border-color:#0E5C4A;color:#fff;}
.tile.combo .nm{font-weight:700;}
.tile.combo .ct{color:rgba(255,255,255,.6);}
.tile.doses{grid-column:1 / -1;background:var(--ouro);border-color:var(--ouro);color:#3A2A05;}
.tile.doses .nm{font-size:15px;font-weight:750;}
.tile.doses .ct{color:rgba(58,42,5,.62);font-weight:600;}

/* ---------- lista de preços ---------- */
.voltar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;width:100%;
  height:50px;padding:0 var(--gut);background:#fff;border:0;border-bottom:1px solid var(--line);
  cursor:pointer;text-align:left;}
.voltar .ch{font-size:20px;color:var(--nav);line-height:1;}
.voltar .tx{font-size:15px;font-weight:600;}
.voltar .qt{margin-left:auto;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums;}

.cab{position:sticky;top:50px;z-index:10;background:var(--sheet);
  padding:7px var(--gut);font-size:11.5px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--mute);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.cab.solto{position:static;}

.item{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;
  padding:10px var(--gut);background:none;border:0;border-bottom:1px solid #EFF2F7;
  text-align:left;cursor:pointer;}
.item:disabled{cursor:default;}
.item:not(:disabled):active{background:#F7F9FC;}
.nm{flex:1;min-width:0;font-size:15.5px;font-weight:550;line-height:1.28;}
.nm .zer{display:inline-block;margin-left:7px;font-size:11px;font-weight:600;
  color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 5px;
  vertical-align:1px;white-space:nowrap;}
.pr{flex:0 0 auto;text-align:right;}
.pr .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em;}
.pr .rot{display:block;font-size:11px;color:var(--mute);font-weight:500;margin-top:1px;}
.seta{flex:0 0 auto;width:11px;text-align:center;color:#B9C0CE;font-size:15px;
  transition:transform .15s;}
.item.ab .seta{transform:rotate(90deg);}

.det{background:var(--sheet);border-bottom:1px solid #EFF2F7;padding:2px var(--gut) 11px;}
.op{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid #E6EBF3;}
.op:first-child,.grupo-t + .op{border-top:0;}
.op .lb{flex:1;min-width:0;}
.op .lb span{display:block;font-size:14.5px;font-weight:550;line-height:1.3;}
.op .lb em{display:block;font-style:normal;font-size:12.5px;color:var(--mute);margin-top:2px;}
.op .vl{flex:0 0 auto;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
.op.fora .lb span,.op.fora .vl{color:var(--mute);}
.grupo-t{margin:11px 0 1px;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;color:var(--nav);}
.op + .grupo-t{margin-top:14px;}
.vem{margin:3px 0 2px;font-size:12.5px;color:var(--mute);line-height:1.45;}
.sabores{margin:9px 0 2px;padding:9px 11px;background:#fff;border:1px solid var(--line);
  border-radius:8px;font-size:13px;color:var(--ink);line-height:1.5;}
.sabores b{font-weight:650;}
.aviso{margin:9px 0 2px;padding:9px 11px;background:var(--ouro-fundo);
  border:1px solid #F0DFB4;border-radius:8px;font-size:12.5px;color:#6B551D;line-height:1.45;}

/* ---------- área da dona ---------- */
.entrada{display:block;width:100%;margin-top:26px;padding:13px;border:1px solid rgba(255,255,255,.2);
  background:transparent;color:rgba(255,255,255,.7);border-radius:10px;
  font-size:13.5px;font-weight:600;cursor:pointer;}
.entrada:active{background:rgba(255,255,255,.08);}

.dona-topo{position:sticky;top:0;z-index:25;background:var(--ouro);color:#3A2A05;
  padding:calc(9px + env(safe-area-inset-top)) var(--gut) 11px;}
.dona-topo .l1{display:flex;align-items:center;gap:10px;}
.admin-lista{padding:4px 0 30px;}
.admin-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:13px var(--gut);background:none;border:0;border-bottom:1px solid #EFF0F2;
  font-family:inherit;color:inherit;cursor:pointer;}
.admin-item:active{background:#FAFAFA;}
.admin-item .nm{flex:1;min-width:0;font-size:15px;font-weight:600;}
.admin-item .ct{flex:0 0 auto;font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;}
.admin-item .seta{flex:0 0 auto;width:10px;color:#B9C0CE;font-size:14px;}

.admin-corpo{padding:2px var(--gut) 130px;}
.secao-t{margin:20px 0 3px;font-size:12px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--nav);}
.secao-t:first-child{margin-top:14px;}
.secao-t.separa{margin-top:26px;}
.aviso-leve{margin:0 0 10px;font-size:12.5px;color:var(--mute);line-height:1.45;}
.vazio-leve{margin:6px 0 4px;font-size:13.5px;color:var(--mute);}
.doses-aviso{padding:0 var(--gut);margin-top:10px;}

.ro{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #F0F0F0;}
.ro:first-of-type{border-top:0;}
.ro .nm{flex:1;min-width:0;font-size:14px;color:#444;}
.ro .pr{flex:0 0 auto;text-align:right;}
.ro .pr .v{font-size:14.5px;font-weight:650;color:#444;}
.ro .pr .rot{display:block;font-size:11px;color:var(--mute);}

.manual{padding:12px 0;border-top:1px solid #F0F0F0;}
.manual:first-of-type{border-top:0;}
.duas{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.uma{display:grid;grid-template-columns:1fr;gap:8px;max-width:220px;}

.form-novo{margin-top:12px;padding:14px;border:1.5px solid var(--line);border-radius:11px;background:#FAFBFC;}
.campo-form{display:block;margin-bottom:10px;}
.campo-form .tit{display:block;font-size:11.5px;font-weight:650;color:var(--mute);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.campo-form input[type="text"]{width:100%;height:44px;padding:0 11px;border:1.5px solid var(--line);
  border-radius:9px;font-family:inherit;font-size:15px;background:#fff;color:var(--ink);outline:none;}
.campo-form input:focus{border-color:var(--nav);}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink);margin:2px 0 4px;}
.chk input{width:17px;height:17px;}
.form-botoes{display:flex;gap:10px;margin-top:8px;}
.btn-cancelar{flex:0 0 auto;height:44px;padding:0 16px;border:1px solid var(--line);border-radius:9px;
  background:#fff;color:var(--mute);font-size:14px;font-weight:600;cursor:pointer;}
.btn-add{flex:1;height:44px;border:0;border-radius:9px;background:var(--nav);color:#fff;
  font-size:14.5px;font-weight:700;cursor:pointer;}
.dona-topo h2{margin:0;font-size:15.5px;font-weight:750;flex:1;}
.dona-topo .sair{height:38px;padding:0 13px;border:1px solid rgba(58,42,5,.3);
  background:rgba(255,255,255,.55);border-radius:8px;font-size:13.5px;font-weight:650;cursor:pointer;}
.dona-topo p{margin:7px 0 0;font-size:12.5px;line-height:1.45;color:rgba(58,42,5,.8);}

.teste{margin:0;padding:11px var(--gut);background:#FFF4D6;border-bottom:1px solid #F0DFB4;
  font-size:12.5px;color:#6B551D;line-height:1.45;}
.teste b{font-weight:700;}

.dose-lista{padding:4px 0 130px;}
.dose{padding:13px var(--gut);border-bottom:1px solid #EFF0F2;}
.dose .cab-d{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.dose .nome-d{flex:1;min-width:0;font-size:15.5px;font-weight:650;line-height:1.3;}
.dose .apagar-d{width:38px;height:38px;flex:0 0 auto;border:1px solid var(--line);background:#fff;
  border-radius:8px;color:var(--mute);font-size:17px;line-height:1;cursor:pointer;}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tres label{display:block;}
.tres .tit{display:block;font-size:11.5px;font-weight:650;color:var(--mute);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.moeda{position:relative;}
.moeda .cif{position:absolute;left:9px;top:50%;transform:translateY(-50%);
  font-size:13px;color:var(--mute);pointer-events:none;}
.moeda input{width:100%;height:48px;padding:0 8px 0 30px;border:1.5px solid var(--line);
  border-radius:9px;font-family:inherit;font-size:16.5px;font-weight:650;
  font-variant-numeric:tabular-nums;background:#fff;color:var(--ink);outline:none;}
.moeda input:focus{border-color:var(--nav);}
.moeda input.mudou{border-color:var(--ouro);background:#FFFDF5;}

.nova{margin:14px var(--gut);padding:14px;border:1.5px dashed var(--line);background:#fff;
  border-radius:11px;width:calc(100% - var(--gut) * 2);font-size:14.5px;font-weight:650;
  color:var(--nav);cursor:pointer;}

.salvar-barra{position:fixed;left:0;right:0;bottom:0;z-index:40;
  padding:11px var(--gut) calc(11px + env(safe-area-inset-bottom));
  background:#fff;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:11px;box-shadow:0 -4px 16px rgba(0,0,0,.06);}
.salvar-barra .cnt{flex:1;min-width:0;font-size:13.5px;color:var(--mute);line-height:1.35;}
.salvar-barra .cnt b{color:var(--ink);font-weight:650;}
.btn-salvar{height:48px;padding:0 22px;border:0;border-radius:10px;background:var(--nav);
  color:#fff;font-size:15.5px;font-weight:700;cursor:pointer;flex:0 0 auto;}
.btn-salvar:disabled{background:#C7CAD1;cursor:default;}
.btn-desfazer{height:48px;padding:0 15px;border:1px solid var(--line);border-radius:10px;
  background:#fff;font-size:14.5px;font-weight:600;color:var(--mute);cursor:pointer;flex:0 0 auto;}


.vazio{text-align:center;padding:58px 24px;color:var(--mute);}
.vazio strong{display:block;font-size:18px;color:var(--ink);margin-bottom:7px;}
.rod{padding:16px var(--gut) 34px;text-align:center;font-size:12px;color:#98A1B2;}

.grade.destaques{grid-template-columns:repeat(3,minmax(0,1fr));}
.titulo.separa{margin-top:20px;}
@media (min-width:560px){.grade{grid-template-columns:repeat(3,minmax(0,1fr));}}
@media (min-width:760px){
  :root{--gut:26px;}
  body{background:#EDEFF3;}
  .item:not(:disabled):hover{background:#F2F5FA;}
  .tile:hover{background:var(--nav-claro);}
  .tile.doses:hover{background:#E5AE3A;}
  .tile.combo:hover{background:#12735C;}
  .atualizar:not(:disabled):hover{border-color:var(--nav);}

  /* topo: marca e busca na mesma linha */
  .topo{padding-top:16px;padding-bottom:16px;}
  .marca{margin-bottom:0;float:none;}
  .topo{display:flex;align-items:center;gap:28px;}
  .marca{flex:0 0 auto;}
  .campo{flex:1;max-width:560px;}
  .campo input{height:48px;font-size:16px;}

  /* quadro: mais colunas, sem azul sobrando */
  .marca .sub{display:none;}

  /* estrutura: menu fixo + conteudo */
  #tela{background:transparent;}
  .pc{display:grid;grid-template-columns:250px minmax(0,1fr);
    gap:0;width:100%;
    height:calc(100vh - var(--alto-topo, 130px));}
  html,body{height:100%;overflow:hidden;}
  body{display:flex;flex-direction:column;}
  #tela{flex:1;min-height:0;overflow-y:auto;}
  .topo,.estado{flex:0 0 auto;}
  .painel{background:var(--nav);padding:16px 14px 24px;overflow-y:auto;}
  .painel .titulo{margin:0 0 9px 3px;font-size:11.5px;font-weight:700;
    letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);}
  .painel .titulo.separa{margin-top:18px;}
  .menu{display:flex;flex-direction:column;gap:4px;}
  .mi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    padding:9px 11px;border:1px solid transparent;border-radius:8px;
    background:transparent;color:rgba(255,255,255,.86);cursor:pointer;font-size:13.5px;}
  .mi .nm{flex:1;min-width:0;font-weight:600;line-height:1.25;}
  .mi .ct{flex:0 0 auto;font-size:11.5px;color:rgba(255,255,255,.42);font-variant-numeric:tabular-nums;}
  .mi:hover{background:rgba(255,255,255,.09);}
  .mi.on{background:#fff;color:var(--nav);}
  .mi.on .ct{color:rgba(7,24,128,.5);}
  .mi.doses{color:var(--ouro);}
  .mi.doses.on{background:var(--ouro);color:#3A2A05;}
  .mi.doses.on .ct{color:rgba(58,42,5,.6);}
  .mi.combo{color:#5FD0B4;}
  .mi.combo.on{background:#0E5C4A;color:#fff;}
  .painel .entrada{margin-top:20px;padding:10px;font-size:12.5px;}

  .conteudo{background:#fff;overflow-y:auto;}
  .corpo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
    column-gap:30px;align-content:start;padding:0 22px 30px;}
  .corpo > .cab, .corpo > .rod{grid-column:1 / -1;}
  .cab{position:sticky;top:0;z-index:5;margin-inline:-22px;
    padding:13px 22px 11px;background:#fff;
    font-size:19px;font-weight:800;letter-spacing:-.01em;
    text-transform:none;color:var(--nav);
    border-top:0;border-bottom:2px solid var(--nav);}
  .corpo > .cab + .li .item{border-top:0;}
  .corpo > .cab ~ .cab{margin-top:34px;}
  .item .nm{font-size:14.5px;font-weight:600;color:#22262E;}
  .item .pr .v{font-size:16px;}
  .li{min-width:0;align-self:start;}
  .item{padding-inline:0;}
  .det{padding:2px 12px 11px;background:#F8F9FC;border-radius:0 0 8px 8px;}
  .quadro{display:none;}
}
@media (min-width:1500px){
  .corpo{grid-template-columns:repeat(3,minmax(0,1fr));}
}
@media (min-width:760px){
  .admin-lista,.admin-corpo,.dona-topo .l1,.dona-topo p,.teste,.doses-aviso,.dose-lista,
  .voltar,.salvar-barra{ max-width:760px; margin-inline:auto; }
  .form-novo{max-width:420px;}
}
body.dona .topo,body.dona .estado{display:none;}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

(function montar(){
  BRUTO.trim().split("#").slice(1).forEach(function(bloco){
    var linhas = bloco.trim().split("\n");
    var nomeCat = linhas[0].trim();
    var itens = [];
    linhas.slice(1).forEach(function(linha){
      var i = linha.indexOf("=");
      if (i < 0) return;
      var nome = linha.slice(0, i), resto = linha.slice(i + 1);
      var it;

      if (resto.indexOf("@") >= 0) {                 /* combo unificado */
        var pedacos = resto.split("@");
        var vars = pedacos[0].split(";").map(function(v){
          var t = v.split("~");
          var cab = t[0];                            /* RB ou EN, opcional §sabor */
          var g = cab.slice(0, 2);
          var sabor = cab.indexOf("\u00a7") >= 0 ? cab.split("\u00a7")[1] : null;
          return { grupo: g, sabor: sabor, preco: Number(t[1]) };
        });
        it = { cat: nomeCat, nome: nome, combo: true, vars: vars,
               descRB: pedacos[1] || null, descEN: pedacos[2] || null,
               busca: pedacos[3] || "", extras: false, doses: false };
      } else {
        var extras = resto.charAt(resto.length - 1) === "+";
        if (extras) resto = resto.slice(0, -1);
        var vs = resto.split(";").map(function(v){
          var p = v.split("~");
          return { rot: p[0], preco: Number(p[1]), fora: p[2] === "0" };
        });
        it = { cat: nomeCat, nome: nome, vars: vs, extras: extras, doses: false };
      }
      itens.push(it); TODOS.push(it);
    });
    if (itens.length) CAT.push({ nome: nomeCat, itens: itens });
  });

  var d = [];
  DOSES.trim().split("\n").forEach(function(linha){
    var i = linha.lastIndexOf("=");
    if (i < 0) return;
    var v = linha.slice(i + 1).split(";").map(Number);
    var it = { cat: "DOSES", nome: linha.slice(0, i), doses: true, extras: false,
      vars: [{rot:"Com Red Bull",preco:v[2]},{rot:"Com Vibe/Baly",preco:v[1]},{rot:"Pura",preco:v[0]}] };
    d.push(it); TODOS.push(it);
  });
  if (d.length) CAT.unshift({ nome: "DOSES", itens: d });

  var ordemTopo = ["DOSES", "COMBO WHISKY", "COMBO GIN", "COMBO VODKAS"];

    if (ia < 0 && ib < 0) return 0;
    if (ia < 0) return 1;
    if (ib < 0) return -1;

function agrupar(){
  GRUPOS.forEach(function(g){
    var c = CAT.filter(function(x){ return x.nome === g.cat; })[0];
    if (!c) return;
    var achados = [], pos = -1;
    g.membros.forEach(function(m){
      for (var i = 0; i < c.itens.length; i++){
        if (c.itens[i].nome === m){ if (pos < 0) pos = i; achados.push(c.itens[i]); return; }
      }
    });
    if (achados.length < 2) return;
    var base0 = achados[0];
    var novo = { cat: g.cat, nome: g.nome, vars: base0.vars,
      extras: base0.extras, doses: false,
      combo: base0.combo, descRB: base0.descRB, descEN: base0.descEN,
      sabores: g.sabores.slice(0, achados.length),
      busca: g.membros.join(" ") + " " + (base0.busca || "") };
    c.itens = c.itens.filter(function(x){ return achados.indexOf(x) < 0; });
    c.itens.splice(pos, 0, novo);
    TODOS = TODOS.filter(function(x){ return achados.indexOf(x) < 0; });
    TODOS.push(novo);
  });
  /* mantém a ordem original da lista geral */
  var ordem = {};
  CAT.forEach(function(c, i){ c.itens.forEach(function(it, j){ ordem[it.cat + "|" + it.nome] = i * 1000 + j; }); });
  TODOS.sort(function(a, b){ return ordem[a.cat + "|" + a.nome] - ordem[b.cat + "|" + b.nome]; });
}

var COMBO_CATS = ["COMBO WHISKY", "COMBO GIN", "COMBO VODKAS"];

function limparNomeCombo(s){
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase()
    .replace(/\bRED\s*BULL\b|\bREDBULL\b/g, "")
    .replace(/\b12A\b/g, "12 ANOS")
    .replace(/\bGENT\b/g, "GENTLEMAN")
    .replace(/\bWHISKY\b|\bVODKA\b/g, "")
    .replace(/[^A-Z0-9]/g, " ").replace(/\s+/g, " ").trim();
}
function ehRedBullNome(n){ return /RED\s*BULL|REDBULL/i.test(n); }
function resumoDescricao(d){
  if (!d) return null;
  var linhas = d.split("\n").map(function(x){ return x.trim(); }).filter(Boolean);
  return linhas.map(function(x){ return x.replace(/^COMBO COM\s*/i, "").replace(/COPOS 7$/, "COPOS 770"); }).join(" | ");
}

function pareiaCombos(itensCombo){
  var semRB = itensCombo.filter(function(p){ return !ehRedBullNome(p.nome); });
  var comRB = itensCombo.filter(function(p){ return ehRedBullNome(p.nome); });
  var usados = [];
  var resultado = [];

  semRB.forEach(function(a){
    var ka = limparNomeCombo(a.nome);
    var idx = -1;
    for (var i = 0; i < comRB.length; i++){
      if (usados.indexOf(i) >= 0) continue;
      if (limparNomeCombo(comRB[i].nome) === ka){ idx = i; break; }
    }
    if (idx < 0){
      for (var j = 0; j < comRB.length; j++){
        if (usados.indexOf(j) >= 0) continue;
        var kb = limparNomeCombo(comRB[j].nome);
        if (kb.indexOf(ka) === 0 || ka.indexOf(kb) === 0){ idx = j; break; }
      }
    }
    var b = idx >= 0 ? comRB[idx] : null;
    if (idx >= 0) usados.push(idx);
    var varsRB = b ? b.vars.map(function(v){ return { grupo: "RB", sabor: v.rot || null, preco: v.preco }; }) : [];
    var varsEN = a.vars.map(function(v){ return { grupo: "EN", sabor: v.rot || null, preco: v.preco }; });
    resultado.push({
      cat: a.cat, nome: a.nome, combo: true, vars: varsRB.concat(varsEN),
      descRB: resumoDescricao(b ? b.descricao : null),
      descEN: resumoDescricao(a.descricao),
      busca: b ? b.nome : "", extras: false, doses: false
    });
  });
  comRB.forEach(function(b, idx){
    if (usados.indexOf(idx) >= 0) return;
    var varsRB = b.vars.map(function(v){ return { grupo: "RB", sabor: v.rot || null, preco: v.preco }; });
    resultado.push({
      cat: b.cat, nome: b.nome, combo: true, vars: varsRB,
      descRB: resumoDescricao(b.descricao), descEN: null, busca: "", extras: false, doses: false
    });
  });
  return resultado;
}

function construirCatalogoDoCardapio(itensBrutos){
  var porCat = {};
  itensBrutos.forEach(function(p){ (porCat[p.cat] = porCat[p.cat] || []).push(p); });
  var novoCAT = [];
  for (var nomeCat in porCat){
    var itensCat;
    if (COMBO_CATS.indexOf(nomeCat) >= 0){
      itensCat = pareiaCombos(porCat[nomeCat]);
    } else {
      itensCat = porCat[nomeCat].map(function(p){
        return { cat: p.cat, nome: p.nome, vars: p.vars, extras: p.extras, doses: false };
      });
    }
    novoCAT.push({ nome: nomeCat, itens: itensCat });
  }
  return novoCAT;
}

function aplicarCardapio(novoCAT){
  /* mantém as doses e os itens manuais intactos; troca só o restante do cardápio */
  TODOS = TODOS.filter(function(it){ return it.doses || it.manual; });
  CAT.forEach(function(c){ c.itens = c.itens.filter(function(it){ return it.doses || it.manual; }); });

  novoCAT.forEach(function(grupo){
    var alvo = CAT.filter(function(c){ return c.nome === grupo.nome; })[0];
    if (!alvo){ alvo = { nome: grupo.nome, itens: [] }; CAT.push(alvo); }
    var manuaisExistentes = alvo.itens;
    alvo.itens = grupo.itens.concat(manuaisExistentes);
    grupo.itens.forEach(function(it){ TODOS.push(it); });
  });

  agrupar();

  var ordemTopo = ["DOSES", "COMBO WHISKY", "COMBO GIN", "COMBO VODKAS"];
  CAT.sort(function(a, b){
    var ia = ordemTopo.indexOf(a.nome), ib = ordemTopo.indexOf(b.nome);
    if (ia < 0 && ib < 0) return 0;
    if (ia < 0) return 1;
    if (ib < 0) return -1;
    return ia - ib;
  });
}

function salvarCacheCardapio(dados){
  try { localStorage.setItem(cardapioCacheKey, JSON.stringify({ dados: dados, quando: Date.now() })); }
  catch (e){ /* sem localStorage — sem problema */ }
}
function carregarCacheCardapio(){
  try {
    var bruto = localStorage.getItem(cardapioCacheKey);
    if (!bruto) return null;
    var obj = JSON.parse(bruto);
    if (!obj || !Array.isArray(obj.dados)) return null;
    return obj;
  } catch (e){ return null; }
}

function sincronizarCardapio(manual){
  if (cardapioSincronizando) return Promise.resolve();
  cardapioSincronizando = true;
  if (manual){ elAtualizar.disabled = true; elAtualizar.textContent = "Buscando…"; }
  marcarHora();

  var url = SUPABASE_URL + "/rest/v1/cardapio_sync?select=dados,atualizado_em&id=eq.1";
  return fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + tokenAtivo() } })
    .then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function(linhas){
      if (!Array.isArray(linhas) || !linhas.length || !Array.isArray(linhas[0].dados) || !linhas[0].dados.length){
        throw new Error("resposta vazia");
      }
      var dados = linhas[0].dados;
      aplicarCardapio(construirCatalogoDoCardapio(dados));
      salvarCacheCardapio(dados);
      cardapioFonte = "nuvem";
      cardapioQuando = new Date(linhas[0].atualizado_em);
    })
    .catch(function(){
      if (cardapioFonte !== "nuvem"){
        var cache = carregarCacheCardapio();
        if (cache){
          aplicarCardapio(construirCatalogoDoCardapio(cache.dados));
          cardapioFonte = "cache";
          cardapioQuando = new Date(cache.quando);
        }
      }
    })
    .finally(function(){
      cardapioSincronizando = false;
      if (manual){ elAtualizar.disabled = false; elAtualizar.textContent = "Atualizar"; }
      marcarHora();
      render();
    });
}

/* ============ util ============ */
function limpar(s){ return s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().trim(); }
function brl(n){ return "R$ " + n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function qtdDe(r){ var m = String(r).match(/(\d+)\s*(UN|UNID)?/i); var n = m ? Number(m[1]) : 0; return n > 1 ? n : null; }
function bonito(r){
  if (!r) return "Preço";
  var t = String(r).trim();
  if (/^UNIDADE$/i.test(t)) return "Uma unidade";
  t = t.replace(/^EMBALAGEM COM\s*/i, "Embalagem com ");
  t = t.replace(/^CAIXA C\/\s*/i, "Caixa com ").replace(/^CAIXA COM\s*/i, "Caixa com ");
  t = t.replace(/^PACOTE COM\s*/i, "Pacote com ").replace(/^PCT\s*/i, "Pacote ");
  t = t.replace(/\b([A-ZÀ-Ú]{2,})\b/g, function(p){
    if (/^(ML|L|KG|G|UN|IPA)$/i.test(p)) return p.toUpperCase();
    return p.charAt(0) + p.slice(1).toLowerCase();
  });
  return t.charAt(0).toUpperCase() + t.slice(1);
}

function vemTexto(d){
  var partes = d.split("|").map(function(x){ return arrumaVem(x.trim()); });
  if (partes.length === 1) return "Vem: " + partes[0];
  /* separa o que muda do que é comum */
  var comum = partes[0].split(" + ").slice(1).join(" + ");
  var iguais = partes.every(function(p){ return p.split(" + ").slice(1).join(" + ") === comum; });
  if (iguais){
    var opcoes = partes.map(function(p){ return p.split(" + ")[0]; });
    return "Vem: " + opcoes.join(", ou ") + " + " + comum;
  }
  return "Vem: " + partes.join(" · ou · ");
}

function arrumaVem(t){
  t = t.replace(/COPOS 7\b/, "COPOS 770")
       .replace(/REDBULL/gi, "Red Bull")
       .replace(/ENERGETICO/gi, "Vibe/Baly")
       .replace(/AGUA DE COCO/gi, "água de coco")
       .replace(/SUCO DEL VALLE/gi, "suco Del Valle")
       .replace(/GELOS/gi, "gelos")
       .replace(/COPOS/gi, "copos")
       .replace(/\b(\d+)L\b/gi, "$1L")
       .replace(/\b(\d+)ML\b/gi, "$1ml");
  return t;
}

function tokenAtivo(){
  if (sessaoAdmin) return sessaoAdmin.access_token;
  if (sessaoEquipe) return sessaoEquipe.access_token;
  return SUPABASE_KEY;
}

function loginComSenha(email, senha){
  return fetch(AUTH_URL + "/token?grant_type=password", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email: email, password: senha })
  }).then(function(r){
    return r.json().then(function(d){
      if (!r.ok) throw new Error(traduzErroLogin(d.error_description || d.msg));
      return { access_token: d.access_token, refresh_token: d.refresh_token };
    });
  });
}

function traduzErroLogin(msg){
  if (!msg) return "Não consegui entrar. Tenta de novo.";
  if (/invalid login credentials/i.test(msg)) return "Senha incorreta.";
  if (/too many requests/i.test(msg)) return "Muitas tentativas. Espera um minuto e tenta de novo.";
  return msg;
}

function renovarSessaoEquipe(refresh_token){
  return fetch(AUTH_URL + "/token?grant_type=refresh_token", {
    method: "POST",
    headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ refresh_token: refresh_token })
  }).then(function(r){
    return r.json().then(function(d){
      if (!r.ok) throw new Error("sessão expirada");
      return { access_token: d.access_token, refresh_token: d.refresh_token };
    });
  });
}

function salvarSessaoEquipe(s){
  sessaoEquipe = s;
  try { localStorage.setItem(SESSAO_EQUIPE_KEY, JSON.stringify(s)); } catch (e){}
}
function carregarSessaoEquipeSalva(){
  try {
    var bruto = localStorage.getItem(SESSAO_EQUIPE_KEY);
    return bruto ? JSON.parse(bruto) : null;
  } catch (e){ return null; }
}
function limparSessaoEquipe(){
  sessaoEquipe = null;
  try { localStorage.removeItem(SESSAO_EQUIPE_KEY); } catch (e){}
}

setInterval(function(){
  if (sessaoEquipe) renovarSessaoEquipe(sessaoEquipe.refresh_token).then(salvarSessaoEquipe).catch(function(){});
}, 45 * 60 * 1000);


var doseFonte = "embutido";      /* embutido | cache | nuvem */
var doseQuando = null;           /* Date da última sincronização boa */
var doseSincronizando = false;

function statusDosesHTML(){
  if (doseSincronizando || manualSincronizando || cardapioSincronizando) return " · <span class=\"status-doses\">atualizando dados…</span>";
  var ranking = { embutido: 0, cache: 1, nuvem: 2 };
  var fontes = [
    { f: doseFonte, q: doseQuando },
    { f: manualFonte, q: manualQuando },
    { f: cardapioFonte, q: cardapioQuando }
  ];
  var pior = fontes[0];
  fontes.forEach(function(x){ if (ranking[x.f] < ranking[pior.f]) pior = x; });
  if (pior.f === "nuvem") return " · <span class=\"status-doses ok\">dados às " + horas(pior.q) + "</span>";
  if (pior.f === "cache") return " · <span class=\"status-doses\">dados de " + horas(pior.q) + " (offline)</span>";
  return " · <span class=\"status-doses aviso\">dados não sincronizados</span>";
}

function aplicarDoses(linhas){
  var novos = linhas.map(function(r){
    return { cat: "DOSES", nome: String(r.nome).toUpperCase(), doses: true, extras: false, id: r.id,
      vars: [
        { rot: "Com Red Bull", preco: Number(r.preco_red_bull) },
        { rot: "Com Vibe/Baly", preco: Number(r.preco_vibe_baly) },
        { rot: "Pura", preco: Number(r.preco_pura) }
      ] };
  });
  TODOS = TODOS.filter(function(it){ return !it.doses; });
  novos.forEach(function(it){ TODOS.push(it); });
  var catDoses = CAT.filter(function(c){ return c.nome === "DOSES"; })[0];
  if (catDoses) catDoses.itens = novos;
  else CAT.unshift({ nome: "DOSES", itens: novos });
}

/* ============ itens manuais (qualquer categoria, adicionados pela dona) ============ */
var manualSincronizado = {};   /* { catNome: [ {id, cat, nome, vars, manual:true} ] } — última cópia confirmada do banco */
var manualCacheKey = "adega_manual_cache_v1";
var manualFonte = "embutido";  /* embutido | cache | nuvem */
var manualQuando = null;
var manualSincronizando = false;

function aplicarManuais(linhas){
  /* linhas: [{id, categoria, nome, preco, variante_nome, variante_preco}] */
  var porCat = {};
  linhas.forEach(function(r){
    var vars = [{ rot: r.variante_nome ? "Unidade" : "", preco: Number(r.preco) }];
    if (r.variante_nome) vars.push({ rot: r.variante_nome, preco: Number(r.variante_preco) });
    var it = { cat: r.categoria, nome: String(r.nome).toUpperCase(), vars: vars,
      extras: false, doses: false, manual: true, id: r.id };
    (porCat[r.categoria] = porCat[r.categoria] || []).push(it);
  });

  /* remove os itens manuais antigos de TODOS e de cada categoria, e insere os novos */
  TODOS = TODOS.filter(function(it){ return !it.manual; });
  CAT.forEach(function(c){ c.itens = c.itens.filter(function(it){ return !it.manual; }); });
  for (var catNome in porCat){
    var alvo = CAT.filter(function(c){ return c.nome === catNome; })[0];
    if (alvo) alvo.itens = alvo.itens.concat(porCat[catNome]);
    porCat[catNome].forEach(function(it){ TODOS.push(it); });
  }
  manualSincronizado = porCat;
}

function manuaisAtuais(nome){
  return manualSincronizado[nome] || [];
}

function salvarCacheManuais(linhas){
  try { localStorage.setItem(manualCacheKey, JSON.stringify({ dados: linhas, quando: Date.now() })); }
  catch (e){ /* sem localStorage — sem problema, só não guarda cópia */ }
}
function carregarCacheManuais(){
  try {
    var bruto = localStorage.getItem(manualCacheKey);
    if (!bruto) return null;
    var obj = JSON.parse(bruto);
    if (!obj || !Array.isArray(obj.dados)) return null;
    return obj;
  } catch (e){ return null; }
}

function sincronizarManuais(manual){
  if (manualSincronizando) return Promise.resolve();
  manualSincronizando = true;
  if (manual){ elAtualizar.disabled = true; elAtualizar.textContent = "Buscando…"; }
  marcarHora();

  var url = SUPABASE_URL + "/rest/v1/itens_manuais?select=id,categoria,nome,preco,variante_nome,variante_preco&order=nome.asc";
  return fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + tokenAtivo() } })
    .then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function(dados){
      if (!Array.isArray(dados)) throw new Error("resposta inválida");
      aplicarManuais(dados);
      salvarCacheManuais(dados);
      manualFonte = "nuvem";
      manualQuando = new Date();
    })
    .catch(function(){
      if (manualFonte !== "nuvem"){
        var cache = carregarCacheManuais();
        if (cache){
          aplicarManuais(cache.dados);
          manualFonte = "cache";
          manualQuando = new Date(cache.quando);
        }
      }
    })
    .finally(function(){
      manualSincronizando = false;
      if (manual){ elAtualizar.disabled = false; elAtualizar.textContent = "Atualizar"; }
      marcarHora();
      render();
    });
}

function salvarCacheDoses(linhas){
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify({ dados: linhas, quando: Date.now() }));
  } catch (e){ /* localStorage indisponível — sem problema, apenas não guarda cópia */ }
}

function carregarCacheDoses(){
  try {
    var bruto = localStorage.getItem(CACHE_KEY);
    if (!bruto) return null;
    var obj = JSON.parse(bruto);
    if (!obj || !Array.isArray(obj.dados) || !obj.dados.length) return null;
    return obj;
  } catch (e){ return null; }
}

function sincronizarDoses(manual){
  if (doseSincronizando) return;
  doseSincronizando = true;
  if (manual){ elAtualizar.disabled = true; elAtualizar.textContent = "Buscando…"; }
  marcarHora();

  var url = SUPABASE_URL + "/rest/v1/doses?select=id,nome,preco_red_bull,preco_vibe_baly,preco_pura&order=nome.asc";
  return fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + tokenAtivo() } })
    .then(function(r){ if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function(dados){
      if (!Array.isArray(dados) || !dados.length) throw new Error("resposta vazia");
      aplicarDoses(dados);
      salvarCacheDoses(dados);
      doseFonte = "nuvem";
      doseQuando = new Date();
    })
    .catch(function(){
      /* sem internet ou banco fora do ar: usa cache local se existir e ainda não estivermos usando a nuvem */
      if (doseFonte !== "nuvem"){
        var cache = carregarCacheDoses();
        if (cache){
          aplicarDoses(cache.dados);
          doseFonte = "cache";
          doseQuando = new Date(cache.quando);
        }
      }
    })
    .finally(function(){
      doseSincronizando = false;
      if (manual){ elAtualizar.disabled = false; elAtualizar.textContent = "Atualizar"; }
      marcarHora();
      render();
    });
}

/* ============ telas ============ */
function verQuadro(){
  function tile(c){
    var doses = c.nome === "DOSES";
    var combo = c.nome.indexOf("COMBO ") === 0;
    var rotulo = doses ? "Doses" : (combo ? "Combo " + c.nome.slice(6).toLowerCase() : c.nome);
    var classe = "tile" + (doses ? " doses" : (combo ? " combo" : ""));
    return '<button class="' + classe + '" data-cat="' + esc(c.nome) + '">' +
      '<span class="nm">' + esc(rotulo).replace(/\//g, "/\u200B") + '</span>' +
      '<span class="ct">' + c.itens.length + (doses ? " bebidas" : "") + '</span></button>';
  }
  var destaque = CAT.filter(function(c){ return c.nome === "DOSES" || c.nome.indexOf("COMBO ") === 0; });
  var resto = CAT.filter(function(c){ return destaque.indexOf(c) < 0; });

  var h = '<div class="quadro">';
  if (destaque.length){
    h += '<p class="titulo">Mais consultados</p><div class="grade destaques">';
    destaque.forEach(function(c){ h += tile(c); });
    h += '</div>';
  }
  h += '<p class="titulo separa">Todas as categorias</p><div class="grade">';
  resto.forEach(function(c){ h += tile(c); });
  h += '</div>';
  h += '<button class="entrada" id="entrar-dona">Área admin</button>';
  h += '</div>';
  elTela.innerHTML = h;
}

function linhaItem(it, idx){
  var id = it.cat + "|" + it.nome + "|" + idx;
  var ab = itemAberto === id;
  var mais = temMais(it);
  var base = precoBase(it);
  var h = '<button class="item' + (ab ? " ab" : "") + '" data-item="' + esc(id) + '"' + (mais ? "" : " disabled") + '>';
  h += '<span class="nm">' + esc(it.nome);
  h += '</span><span class="pr"><span class="v">' + brl(base.preco) + '</span>';
  var rot = rotuloLinha(it);
  if (rot) h += '<span class="rot">' + esc(rot) + '</span>';
  h += '</span><span class="seta">' + (mais ? "&rsaquo;" : "") + '</span></button>';

  if (ab){
    h += '<div class="det">';

    if (it.combo){
      var temCoco = /COCO|SUCO/i.test(it.descEN || PADRAO.EN);
      var titEN = temCoco ? "Com Vibe/Baly, água de coco ou suco" : "Com Vibe/Baly";
      [["RB", "Com Red Bull", it.descRB || PADRAO.RB],
       ["EN", titEN, it.descEN || PADRAO.EN]]
      .forEach(function(g){
        var lista = it.vars.filter(function(v){ return v.grupo === g[0]; });
        if (!lista.length) return;
        h += '<p class="grupo-t">' + esc(g[1]) + '</p>';
        lista.forEach(function(v){
          h += '<div class="op"><span class="lb"><span>' +
               esc(v.sabor ? bonito(v.sabor) : "Preço do combo") + '</span></span>';
          h += '<span class="vl">' + brl(v.preco) + '</span></div>';
        });
        if (g[2]) h += '<p class="vem">' + esc(vemTexto(g[2])) + '</p>';
      });
      if (it.sabores) h += '<p class="sabores"><b>Sabores:</b> ' + esc(it.sabores.join(" · ")) + '<br>Todos pelo mesmo preço.</p>';
    } else {
      var soUm = it.vars.length === 1 && !it.vars[0].rot;
      if (!soUm) it.vars.forEach(function(v){
        var q = qtdDe(v.rot), un = (q && !it.doses) ? v.preco / q : null;
        h += '<div class="op"><span class="lb"><span>' + esc(bonito(v.rot)) + '</span>';
        if (un) h += '<em>Sai ' + brl(un) + ' cada</em>';
        h += '</span><span class="vl">' + brl(v.preco) + '</span></div>';
      });
      if (it.sabores) h += '<p class="sabores"><b>Sabores:</b> ' + esc(it.sabores.join(" · ")) + '<br>Todos pelo mesmo preço.</p>';
      if (it.extras) h += '<p class="aviso">No cardápio este produto tem opções a escolher (energético ou sabor), que podem mudar o valor. Confira antes de fechar a venda.</p>';
    }
    h += '</div>';
  }
  return h;
}

function verLista(){
  var termos = limpar(busca).split(/\s+/).filter(Boolean);
  var res = TODOS.filter(function(it){
    if (catAberta && it.cat !== catAberta) return false;
    if (!termos.length) return true;
    var alvo = limpar(it.nome + " " + it.cat + " " + (it.busca || "") + " " + (it.sabores ? it.sabores.join(" ") : ""));
    return termos.every(function(t){ return alvo.indexOf(t) >= 0; });
  });

  var h = "";
  if (catAberta){
    h += '<button class="voltar" id="voltar"><span class="ch">&lsaquo;</span>';
    h += '<span class="tx">' + esc(catAberta === "DOSES" ? "Doses" : catAberta) + '</span>';
    h += '<span class="qt">' + res.length + '</span></button>';
  }

  if (!res.length){
    h += '<div class="vazio"><strong>Nenhum produto com esse nome</strong>Confira a escrita ou apague a busca para ver as categorias.</div>';
    elTela.innerHTML = h; ligarVoltar(); return;
  }

  var atual = null;
  h += '<div class="corpo">';
  res.forEach(function(it, i){
    if (!catAberta && it.cat !== atual){
      atual = it.cat;
      h += '<div class="cab solto">' + esc(it.cat === "DOSES" ? "Doses" : it.cat) + '</div>';
    }
    h += '<div class="li">' + linhaItem(it, i) + '</div>';
  });
  h += '<p class="rod">' + res.length + (res.length === 1 ? " produto" : " produtos") + '</p>';
  h += '</div>';
  elTela.innerHTML = h;
  ligarVoltar();
}

function ligarVoltar(){
  var b = document.getElementById("voltar");
  if (b) b.addEventListener("click", function(){ catAberta = null; itemAberto = null; render(); window.scrollTo(0,0); });
}

/* ============ área admin (geral) ============ */
var modoDona = false;
var adminCatAberta = null;   /* null = lista de categorias; senão, nome da categoria aberta */
var doseRascunho = null;     /* rascunho das doses, mantido entre navegações dentro da mesma sessão admin */
var manualRascunhos = {};    /* { catNome: [ {id, nome, variantes:[{rot,preco}], nova, apagada, ref} ] } — rascunho por categoria */
var formNovoAberto = false;
var formComVariante = false;

function dosesAtuais(){
  var c = CAT.filter(function(x){ return x.nome === "DOSES"; })[0];
  return c ? c.itens : [];
}

function abrirDona(){
  modoDona = true;
  adminCatAberta = null;
  doseRascunho = null;
  manualRascunhos = {};
  formNovoAberto = false;
  sessaoAdmin = null;
  document.body.classList.add("dona");
  verLoginAdmin();
  window.scrollTo(0, 0);
}

function verLoginAdmin(erro){
  elTela.innerHTML =
    '<div class="entrada-box" style="margin-top:22vh">' +
    '<h1>Área admin</h1>' +
    '<p>Digite a senha da administradora para editar preços.</p>' +
    (erro ? '<p class="entrada-erro">' + esc(erro) + '</p>' : "") +
    '<input type="password" id="senha-admin" placeholder="Senha" autocomplete="current-password">' +
    '<button id="entrar-admin">Entrar</button>' +
    '<button class="entrada-cancelar" id="cancelar-admin">Cancelar</button>' +
    '</div>';
  var inp = document.getElementById("senha-admin");
  var bt = document.getElementById("entrar-admin");
  function tentar(){
    var senha = inp.value;
    if (!senha) { inp.focus(); return; }
    bt.disabled = true; bt.textContent = "Entrando…";
    loginComSenha(EMAIL_ADMIN, senha)
      .then(function(s){ sessaoAdmin = s; verDona(); })
      .catch(function(e){ verLoginAdmin(e.message); });
  }
  bt.addEventListener("click", tentar);
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") tentar(); });
  document.getElementById("cancelar-admin").addEventListener("click", function(){
    modoDona = false; document.body.classList.remove("dona"); render();
  });
  inp.focus();
}

function fecharDona(){
  var pendente = (doseRascunho && contarMudancasDoses() > 0) || algumRascunhoManualPendente();
  if (pendente && !window.confirm("Você tem alterações que ainda não foram salvas no sistema. Sair mesmo assim?")) return;
  modoDona = false; adminCatAberta = null; sessaoAdmin = null;
  document.body.classList.remove("dona");
  render(); window.scrollTo(0, 0);
}

function algumRascunhoManualPendente(){
  for (var nome in manualRascunhos){
    if (contarMudancasManual(nome) > 0) return true;
  }
  return false;
}

function construirRascunhoManual(nome){
  return manuaisAtuais(nome).map(function(it){
    return { nome: it.nome, id: it.id, ref: it,
      variantes: it.vars.map(function(v){ return { rot: v.rot, preco: v.preco }; }),
      nova: false, apagada: false };
  });
}

function contarMudancasManual(nome){
  var draft = manualRascunhos[nome];
  if (!draft) return 0;
  var n = 0;
  draft.forEach(function(l){
    if (l.apagada || l.nova) { n++; return; }
    var mudou = false;
    l.variantes.forEach(function(v, k){ if (l.ref.vars[k] && v.preco !== l.ref.vars[k].preco) mudou = true; });
    if (mudou) n++;
  });
  return n;
}

function abrirCategoriaAdmin(nome){
  adminCatAberta = nome;
  formNovoAberto = false; formComVariante = false;
  if (nome === "DOSES" && !doseRascunho){
    doseRascunho = dosesAtuais().map(function(it){
      return { nome: it.nome, id: it.id || null, ref: it, valores: it.vars.map(function(v){ return v.preco; }), nova: false, apagada: false };
    });
  }
  if (nome !== "DOSES" && !manualRascunhos[nome]){
    manualRascunhos[nome] = construirRascunhoManual(nome);
  }
  verDona();
  window.scrollTo(0, 0);
}

function voltarListaAdmin(){
  adminCatAberta = null;
  verDona();
  window.scrollTo(0, 0);
}

function contarMudancasDoses(){
  if (!doseRascunho) return 0;
  var n = 0;
  doseRascunho.forEach(function(l){
    if (l.apagada || l.nova) { n++; return; }
    l.valores.forEach(function(v, k){ if (v !== l.ref.vars[k].preco) n++; });
  });
  return n;
}

/* ---- tela 1: lista de categorias (sem destaque de cor) ---- */
function verDona(){
  if (adminCatAberta === "DOSES") return verDonaDoses();
  if (adminCatAberta) return verDonaCategoria(adminCatAberta);

  var h = '<div class="dona-topo"><div class="l1"><h2>Área admin</h2>';
  h += '<button class="sair" id="sair-dona">Sair</button></div>';
  h += '<p>Escolha uma categoria para ver os produtos e adicionar itens que faltam no cardápio.</p></div>';
  h += '<p class="teste"><b>Tudo aqui já é salvo de verdade no sistema.</b> Os itens do cardápio continuam vindo do OlaClick — para mudar algum deles, altere direto por lá.</p>';
  h += '<div class="admin-lista">';
  CAT.forEach(function(c){
    var rotulo = c.nome === "DOSES" ? "Doses" : c.nome;
    h += '<button class="admin-item" data-admcat="' + esc(c.nome) + '">';
    h += '<span class="nm">' + esc(rotulo) + '</span>';
    h += '<span class="ct">' + c.itens.length + '</span><span class="seta">&rsaquo;</span></button>';
  });
  h += '</div>';
  elTela.innerHTML = h;

  document.getElementById("sair-dona").addEventListener("click", fecharDona);
  elTela.querySelectorAll("[data-admcat]").forEach(function(b){
    b.addEventListener("click", function(){ abrirCategoriaAdmin(b.getAttribute("data-admcat")); });
  });
}

/* ---- tela 2a: categoria comum — cardápio (leitura) + itens manuais (edição) ---- */
function verDonaCategoria(nome){
  var cat = CAT.filter(function(c){ return c.nome === nome; })[0];
  var cardapio = cat ? cat.itens.filter(function(it){ return !it.manual; }) : [];
  var draft = manualRascunhos[nome] || [];
  var rotulo = nome === "DOSES" ? "Doses" : nome;
  var visiveis = draft.filter(function(l){ return !l.apagada; });

  var h = '<button class="voltar" id="voltar-admin"><span class="ch">&lsaquo;</span>';
  h += '<span class="tx">' + esc(rotulo) + '</span><span class="qt">' + (cardapio.length + visiveis.length) + '</span></button>';

  h += '<div class="admin-corpo">';
  h += '<p class="secao-t">Itens do cardápio</p>';
  h += '<p class="aviso-leve">Esses preços vêm do OlaClick. Para mudar algum, altere direto no cardápio — aqui é só consulta.</p>';
  if (!cardapio.length){
    h += '<p class="vazio-leve">Nenhum item do cardápio nesta categoria.</p>';
  } else {
    cardapio.forEach(function(it){
      var base = precoBase(it), rot = rotuloLinha(it);
      h += '<div class="ro"><span class="nm">' + esc(it.nome) + '</span>';
      h += '<span class="pr"><span class="v">' + brl(base.preco) + '</span>';
      if (rot) h += '<span class="rot">' + esc(rot) + '</span>';
      h += '</span></div>';
    });
  }

  h += '<p class="secao-t separa">Itens adicionados por você</p>';
  if (!visiveis.length && !formNovoAberto){
    h += '<p class="vazio-leve">Nenhum item adicionado ainda nesta categoria.</p>';
  }

           '<input type="text" inputmode="decimal" data-mi="' + i + '" data-mk="' + k + '" value="' + v.preco.toFixed(2).replace(".", ",") + '"></span></label>';

function atualizarBarraManual(nome){
  var n = contarMudancasManual(nome);
  var cnt = document.getElementById("cnt-mud-manual");
  var bt = document.getElementById("btn-salvar-manual");
  var bd = document.getElementById("btn-desfazer-manual");
  if (!cnt) return;
  cnt.innerHTML = n === 0
    ? "Nenhuma alteração ainda"
    : "<b>" + n + (n === 1 ? " alteração" : " alterações") + "</b> pronta" + (n === 1 ? "" : "s") + " para salvar";
  bt.disabled = n === 0;
  bd.style.display = n === 0 ? "none" : "block";
}

function salvarManualNoBanco(nome){
  var draft = manualRascunhos[nome] || [];
  var btn = document.getElementById("btn-salvar-manual");
  var bd = document.getElementById("btn-desfazer-manual");
  btn.disabled = true; btn.textContent = "Salvando…";
  if (bd) bd.disabled = true;

  var novos = draft.filter(function(l){ return l.nova && !l.apagada; });
  var apagados = draft.filter(function(l){ return l.apagada && !l.nova && l.id; });
  var alterados = draft.filter(function(l){
    if (l.nova || l.apagada || !l.id) return false;
    var mudou = false;
    l.variantes.forEach(function(v, k){ if (l.ref.vars[k] && v.preco !== l.ref.vars[k].preco) mudou = true; });
    return mudou;
  });

  function corpoDe(l){
    var corpo = { preco: l.variantes[0].preco };
    if (l.variantes.length > 1){ corpo.variante_nome = l.variantes[1].rot; corpo.variante_preco = l.variantes[1].preco; }
    else { corpo.variante_nome = null; corpo.variante_preco = null; }
    return corpo;
  }

  var cabecalhoEscrita = { apikey: SUPABASE_KEY, Authorization: "Bearer " + tokenAtivo(),
    "Content-Type": "application/json", Prefer: "return=minimal" };
  var tarefas = [];

  novos.forEach(function(l){
    var corpo = corpoDe(l);
    corpo.categoria = nome; corpo.nome = l.nome;
    tarefas.push(fetch(SUPABASE_URL + "/rest/v1/itens_manuais", {
      method: "POST", headers: cabecalhoEscrita, body: JSON.stringify(corpo)
    }).then(function(r){ if (!r.ok) throw new Error("Não foi possível adicionar \"" + l.nome + "\""); }));
  });
  apagados.forEach(function(l){
    tarefas.push(fetch(SUPABASE_URL + "/rest/v1/itens_manuais?id=eq." + l.id, {
      method: "DELETE", headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + tokenAtivo() }
    }).then(function(r){ if (!r.ok) throw new Error("Não foi possível remover \"" + l.nome + "\""); }));
  });
  alterados.forEach(function(l){
    tarefas.push(fetch(SUPABASE_URL + "/rest/v1/itens_manuais?id=eq." + l.id, {
      method: "PATCH", headers: cabecalhoEscrita, body: JSON.stringify(corpoDe(l))
    }).then(function(r){ if (!r.ok) throw new Error("Não foi possível atualizar \"" + l.nome + "\""); }));
  });

  Promise.allSettled(tarefas).then(function(resultados){
    var falhas = resultados.filter(function(r){ return r.status === "rejected"; });
    if (falhas.length){
      window.alert("Algumas alterações não foram salvas:\n\n" +
        falhas.map(function(f){ return "• " + f.reason.message; }).join("\n") +
        "\n\nAs demais alterações foram salvas. Ajuste o que faltou e clique em Salvar de novo.");
    } else if (tarefas.length) {
      window.alert("Itens salvos! Os funcionários já vão ver essa atualização.");
    }
    manualRascunhos[nome] = null;
    var p = sincronizarManuais(false);
    (p && p.then ? p : Promise.resolve()).then(function(){
      manualRascunhos[nome] = construirRascunhoManual(nome);
      if (adminCatAberta === nome) verDonaCategoria(nome);
    });
  });
}

function ligarFormularioNovoItem(nome){
  var flag = document.getElementById("novo-flag");
  if (flag) flag.addEventListener("change", function(){
    formComVariante = flag.checked;
    document.getElementById("novo-extra").style.display = formComVariante ? "block" : "none";
  });
  var cancelar = document.getElementById("cancelar-novo");
  if (cancelar) cancelar.addEventListener("click", function(){
    formNovoAberto = false; verDonaCategoria(nome);
  });
  var confirmar = document.getElementById("confirmar-novo");
  if (confirmar) confirmar.addEventListener("click", function(){
    var nomeEl = document.getElementById("novo-nome"), precoEl = document.getElementById("novo-preco");
    var nomeProd = nomeEl.value.trim();
    var preco = Number(precoEl.value.replace(/[^\d,.]/g, "").replace(",", "."));
    if (!nomeProd){ nomeEl.focus(); return; }
    if (!preco || preco <= 0){ precoEl.focus(); return; }
    var variantes = [{ rot: "", preco: preco }];
    if (formComVariante){
      var n2 = document.getElementById("novo-nome2").value.trim();
      var p2 = Number(document.getElementById("novo-preco2").value.replace(/[^\d,.]/g, "").replace(",", "."));
      variantes[0].rot = "Unidade";
      variantes.push({ rot: n2 || "Outra forma", preco: (p2 && p2 > 0) ? p2 : 0 });
    }
    if (!manualRascunhos[nome]) manualRascunhos[nome] = [];
    manualRascunhos[nome].push({ nome: nomeProd.toUpperCase(), id: null, ref: { vars: [{preco:-1},{preco:-1}] },
      variantes: variantes, nova: true, apagada: false });
    formNovoAberto = false;
    verDonaCategoria(nome);
  });
}

function verPC(){
  var h = '<div class="pc"><aside class="painel">';
  h += '<p class="titulo">Mais consultados</p><div class="menu">';
  var destaque = CAT.filter(function(c){ return c.nome === "DOSES" || c.nome.indexOf("COMBO ") === 0; });
  var resto = CAT.filter(function(c){ return destaque.indexOf(c) < 0; });
  function bt(c){
    var doses = c.nome === "DOSES", combo = c.nome.indexOf("COMBO ") === 0;
    var rotulo = doses ? "Doses" : (combo ? "Combo " + c.nome.slice(6).toLowerCase() : c.nome);
    return '<button class="mi' + (doses ? " doses" : (combo ? " combo" : "")) +
      (catAberta === c.nome ? " on" : "") + '" data-cat="' + esc(c.nome) + '">' +
      '<span class="nm">' + esc(rotulo) + '</span><span class="ct">' + c.itens.length + '</span></button>';
  }
  destaque.forEach(function(c){ h += bt(c); });
  h += '</div><p class="titulo separa">Todas as categorias</p><div class="menu">';
  h += '<button class="mi' + (catAberta ? "" : " on") + '" data-cat="">' +
       '<span class="nm">Ver tudo</span><span class="ct">' + TODOS.length + '</span></button>';
  resto.forEach(function(c){ h += bt(c); });
  h += '</div><button class="entrada" id="entrar-dona">Área admin</button></aside>';

  h += '<div class="conteudo">' + montarLista() + '</div></div>';
  elTela.innerHTML = h;
}

function montarLista(){
  var termos = limpar(busca).split(/\s+/).filter(Boolean);
  var res = TODOS.filter(function(it){
    if (catAberta && it.cat !== catAberta) return false;
    if (!termos.length) return true;
    var alvo = limpar(it.nome + " " + it.cat + " " + (it.busca || "") + " " + (it.sabores ? it.sabores.join(" ") : ""));
    return termos.every(function(t){ return alvo.indexOf(t) >= 0; });
  });
  if (!res.length)
    return '<div class="vazio"><strong>Nenhum produto com esse nome</strong>Confira a escrita ou escolha outra categoria.</div>';

  var h = '<div class="corpo">', atual = null;
  res.forEach(function(it, i){
    if (it.cat !== atual){
      atual = it.cat;
      h += '<div class="cab solto">' + esc(it.cat === "DOSES" ? "Doses" : it.cat) + '</div>';
    }
    h += '<div class="li">' + linhaItem(it, i) + '</div>';
  });
  h += '<p class="rod">' + res.length + (res.length === 1 ? " produto" : " produtos") + '</p></div>';
  return h;
}

/* tenta usar a última cópia salva imediatamente (para abrir rápido mesmo offline),
   e em seguida busca a versão mais nova no Supabase. */
function iniciarApp(){
  (function(){
    var cache = carregarCacheDoses();
    if (cache){
      aplicarDoses(cache.dados);
      doseFonte = "cache";
      doseQuando = new Date(cache.quando);
    }
    var cacheM = carregarCacheManuais();
    if (cacheM){
      aplicarManuais(cacheM.dados);
      manualFonte = "cache";
      manualQuando = new Date(cacheM.quando);
    }
    var cacheC = carregarCacheCardapio();
    if (cacheC){
      aplicarCardapio(construirCatalogoDoCardapio(cacheC.dados));
      cardapioFonte = "cache";
      cardapioQuando = new Date(cacheC.quando);
    }
  })();

  marcarHora();
  render();
  sincronizarDoses(false);
  sincronizarManuais(false);
  sincronizarCardapio(false);
}

function verEntrada(erro){
  document.body.classList.add("entrada-tela");
  elTela.innerHTML =
    '<div class="entrada-box">' +
    '<img class="entrada-logo" src="' + document.querySelector(".selo").src + '" alt="">' +
    '<h1>Adega Noruega</h1>' +
    '<p>Digite a senha da equipe para consultar os preços.</p>' +
    (erro ? '<p class="entrada-erro">' + esc(erro) + '</p>' : "") +
    '<input type="password" id="senha-equipe" placeholder="Senha" autocomplete="current-password">' +
    '<button id="entrar-equipe">Entrar</button>' +
    '</div>';
  var inp = document.getElementById("senha-equipe");
  var bt = document.getElementById("entrar-equipe");
  function tentar(){
    var senha = inp.value;
    if (!senha) { inp.focus(); return; }
    bt.disabled = true; bt.textContent = "Entrando…";
    loginComSenha(EMAIL_EQUIPE, senha)
      .then(function(s){
        salvarSessaoEquipe(s);
        document.body.classList.remove("entrada-tela");
        iniciarApp();
      })
      .catch(function(e){ verEntrada(e.message); });
  }
  bt.addEventListener("click", tentar);
  inp.addEventListener("keydown", function(e){ if (e.key === "Enter") tentar(); });
  inp.focus();
}

/* ao carregar: tenta usar a sessão da equipe já salva; se não der, pede a senha */
(function(){
  var salva = carregarSessaoEquipeSalva();
  if (!salva){ verEntrada(); return; }
  sessaoEquipe = salva;
  renovarSessaoEquipe(salva.refresh_token)
    .then(function(s){ salvarSessaoEquipe(s); iniciarApp(); })
    .catch(function(){ limparSessaoEquipe(); verEntrada(); });
})();

function ajustarAltura(){
  var t = document.querySelector(".topo"), e = document.querySelector(".estado");
  if (!t || !e) return;
  var alto = t.offsetHeight + e.offsetHeight;
  document.documentElement.style.setProperty("--alto-topo", alto + "px");
}
ajustarAltura();
window.addEventListener("resize", ajustarAltura);
</script>
